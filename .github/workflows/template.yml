# Template-only: scaffolds each shape with scripts/create.ts and runs its gate.
name: Template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: template-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shape: [start, api]
    env:
      HUSKY: "0"
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      # Updates the vendored skills so both scaffolds exercise the default creation path.
      - run: bun scripts/create.ts smoke --shape "$SHAPE" --dir "$RUNNER_TEMP/smoke"
        env:
          SHAPE: ${{ matrix.shape }}
      - name: Lint the generated CI workflow
        working-directory: ${{ runner.temp }}/smoke
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - uses: ./.github/actions/chromium
        with:
          directory: ${{ runner.temp }}/smoke/apps/${{ matrix.shape == 'start' && 'web' || 'app' }}
      - run: bun run verify
        working-directory: ${{ runner.temp }}/smoke
