# Template-only: scaffolds each shape with scripts/create.ts and runs its gate.
name: Template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shape: [start, api]
    env:
      HUSKY: "0"
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Pulls every skill's latest version, so a broken upstream skill shows up here first.
      - run: bun scripts/create.ts smoke --shape "$SHAPE" --dir "$RUNNER_TEMP/smoke"
        env:
          SHAPE: ${{ matrix.shape }}
      - run: bunx playwright install --with-deps chromium
        working-directory: ${{ runner.temp }}/smoke/apps/${{ matrix.shape == 'start' && 'web' || 'app' }}
      - run: bun run verify
        working-directory: ${{ runner.temp }}/smoke
