name: Set up the workspace
description: Install the pinned Node and Bun, restore the Bun and Turbo caches and install with the frozen lockfile.
inputs:
  turbo-key:
    description: Independent Turbo cache writer for each job (none skips the Turbo cache)
    default: none
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    - id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock', 'patches/*.patch') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: bun install --frozen-lockfile
      env:
        HUSKY: "0"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.turbo-key != 'none'
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.turbo-key }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.turbo-key }}-
