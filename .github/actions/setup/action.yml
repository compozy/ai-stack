name: Set up Node and Bun
description: Set up pinned runtimes and restore Bun's package download cache.
inputs:
  install:
    description: Install workspace dependencies with the frozen lockfile.
    default: "true"
  save-cache:
    description: Allow this job to publish the Bun package cache on default-branch pushes.
    default: "false"
outputs:
  node-version:
    description: The installed Node version.
    value: ${{ steps.node.outputs.node-version }}
runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
        no-cache: true
    - id: bun-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock', 'patches/*.patch') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
      env:
        HUSKY: "0"
    - if: >-
        inputs.install == 'true' && inputs.save-cache == 'true' &&
        github.event_name == 'push' && github.ref_name == github.event.repository.default_branch &&
        steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
